<style>
  :root{
    --primary:#2563EB; --primary-dark:#1D4ED8; --primary-tint:#EFF4FF;
    --success:#22C55E; --success-tint:#EAFBF1;
    --warning:#F59E0B; --warning-tint:#FEF6E7;
    --danger:#EF4444;  --danger-tint:#FDECEC;
    --purple:#8B5CF6;  --purple-tint:#F3EEFE;
    --teal:#14B8A6;    --teal-tint:#E9FAF8;
    --bg:#F8FAFC; --card:#FFFFFF;
    --ink:#0F172A; --ink-soft:#475569; --ink-faint:#94A3B8;
    --line:#EEF1F6; --rule:#D8DFE9;
    --radius-sm:10px; --radius-md:14px; --radius-lg:18px;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  .app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{width:248px;flex-shrink:0;background:#0B1220;color:#CBD5E1;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
  .brand-mark{width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.25;}
  .brand-name span{display:block;font-weight:500;color:#8DA2C0;font-size:12px;}
  .nav-group{margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:#AEBBD1;cursor:pointer;transition:background .15s,color .15s;margin-bottom:2px;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:#151E30;color:#fff;}
  .nav-item.active{background:var(--primary);color:#fff;}
  .sidebar-status{margin-top:auto;background:#151E30;border-radius:12px;padding:11px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:#AEBBD1;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.18);}

  /* MAIN */
  .main{flex:1;min-width:0;padding:26px 32px 40px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .greeting h1{font-size:23px;margin:0 0 4px;font-weight:800;}
  .greeting p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

  /* Controls */
  .month-select,.issue-select{font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:8px;color:var(--ink);cursor:pointer;border:1px solid var(--rule);background:var(--card);}
  .btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;}
  .btn svg{width:15px;height:15px;}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .tabs{display:flex;gap:4px;background:#F1F5F9;border-radius:8px;padding:3px;}
  .tab{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:6px;color:var(--ink-soft);cursor:pointer;border:none;background:transparent;font-family:inherit;}
  .tab.active{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  /* KPI cards */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px;}
  .kpi-card{background:var(--card);border-radius:var(--radius-md);padding:16px 16px 15px;box-shadow:var(--shadow);}
  .kpi-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .kpi-icon svg{width:18px;height:18px;}
  .kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .kpi-value{font-size:22px;font-weight:800;margin-bottom:5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .kpi-delta{font-size:11.5px;font-weight:600;}
  .up{color:var(--success);} .down{color:var(--danger);} .flat{color:var(--ink-faint);}

  /* Panels + layout */
  .panel{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .panel-head h3{margin:0;font-size:14.5px;font-weight:700;}
  .panel-head .hint{font-size:11.5px;color:var(--ink-faint);font-weight:600;}
  .cols-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  .cols-3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;align-items:start;}

  /* Section headers, for multi-topic reports */
  .section{margin-top:24px;}
  .section-head{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:16px;}
  .section-num{font-size:13px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;}
  .section-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;}
  .section-head .lede{margin-left:auto;font-size:12.5px;color:var(--ink-faint);font-weight:600;text-align:right;}

  /* Tables */
  table.rt{width:100%;border-collapse:collapse;}
  table.rt th{text-align:left;font-size:11px;letter-spacing:.02em;color:var(--ink-faint);font-weight:700;padding:0 8px 9px;border-bottom:1px solid var(--rule);white-space:nowrap;}
  table.rt td{padding:10px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  table.rt tr:last-child td{border-bottom:none;}
  table.rt td.num, table.rt th.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.rt td.num{font-weight:700;}
  table.rt tfoot td{border-top:2px solid var(--rule);border-bottom:none;font-weight:800;background:#F8FAFC;}
  .scroll{overflow-x:auto;}
  .tall{max-height:400px;overflow-y:auto;}

  /* Bar list */
  .bar-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .bar-row:last-child{border-bottom:none;}
  .bar-label{font-size:12.5px;font-weight:600;width:132px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;height:8px;background:#F1F5F9;border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-val{font-size:12.5px;font-weight:800;width:52px;text-align:right;font-variant-numeric:tabular-nums;}
  .bar-sub{font-size:11px;color:var(--ink-faint);width:78px;text-align:right;white-space:nowrap;}

  /* Small pieces */
  .agent-cell{display:flex;align-items:center;gap:9px;}
  .av-xs{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;overflow:hidden;}
  .av-xs img{width:100%;height:100%;object-fit:cover;display:block;}
  .tag{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;white-space:nowrap;}
  .tag.good{background:var(--success-tint);color:var(--success);}
  .tag.mid{background:var(--warning-tint);color:#B45309;}
  .tag.bad{background:var(--danger-tint);color:var(--danger);}
  .tag.neutral{background:#F1F5F9;color:var(--ink-soft);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;}
  .legend-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);font-weight:600;}
  .legend-row .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .donut-wrap{position:relative;display:flex;justify-content:center;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .donut-center .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .donut-center .lab{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
  .note{color:var(--ink-faint);font-size:12.5px;padding:20px 4px;text-align:center;}
  .flag{background:var(--warning-tint);color:#92620A;border-radius:10px;padding:11px 14px;font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:14px;}

  @media (max-width:1200px){ .cols-3{grid-template-columns:1fr 1fr;} }
  @media (max-width:860px){
    .sidebar{display:none;}
    .main{padding:20px 16px 32px;}
    .cols-2,.cols-3{grid-template-columns:1fr;}
  }

  /* PRINT — ready for when a report needs to be handed over as a PDF. */
  @media print{
    @page{size:A4 portrait;margin:14mm;}
    body{background:#fff;}
    .sidebar,.topbar-right,.no-print{display:none !important;}
    .app{display:block;}
    .main{padding:0;}
    .panel{box-shadow:none;border:1px solid var(--rule);break-inside:avoid;}
    .section{break-inside:avoid;}
    .tall{max-height:none;overflow:visible;}
  }
</style>

<script>
  // ---- Auth check: same pipeline_token + Railway API as the rest of the console ----
  const API_BASE = "https://pipeline-crm-production-412d.up.railway.app/api";
  const LOGIN_PATH = "/login";
  let currentUserName = null;

  (async function checkAuth() {
    const token = localStorage.getItem("pipeline_token");
    if (!token) { window.location.href = LOGIN_PATH; return; }
    try {
      const res = await fetch(`${API_BASE}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error("Invalid session");
      const data = await res.json();
      const user = data.user || data;
      if (user && user.name) currentUserName = user.name;
    } catch (err) {
      localStorage.removeItem("pipeline_token");
      window.location.href = LOGIN_PATH;
    }
  })();
</script>

<script>
// =====================================================================
// REPORTS — emptied 2026-09-20, to be rebuilt one topic at a time.
//
// Data sources available on this page, already wired up:
//   Tickets  — TicketData.fetchTickets() from ticket-data.js (Google Sheets,
//              all brands). Each ticket has: id, name, brandCode, brandLabel,
//              category, issue, channel, priority, statusCls, submitted,
//              acknowledgedBy/At, resolvedBy/At, ackDurationSec,
//              resolveDurationSec, sheetLink.
//   Chat     — apiGet('/chatwoot/stats?from=&to='), '/chatwoot/csat?from=&to=',
//              '/chatwoot/conversations?…', '/chatwoot/pending',
//              '/chatwoot/top-customers?…'  (70-day retention)
//   SMS      — SMS_API_BASE + '/stats?days=N', '/brands', '/messages/log?…'
//   Costs    — apiGet('/billing/consolidated'),
//              apiGet('/openai-billing/summary?range=…&account=all')
//   Avatars  — apiGet('/auth/directory')
// =====================================================================

const SMS_API_BASE = "https://sms-inbox-production-2c98.up.railway.app/api";
const SMS_APP_PASSWORD = "";   // set only if the SMS app re-enables its password
const smsHeaders = () => (SMS_APP_PASSWORD ? { "X-App-Password": SMS_APP_PASSWORD } : {});

const { escapeHtml, relativeTime, formatDuration, colorForName, initialsForName, isSameLocalDay, pctChange } = TicketData;
const PALETTE = ['#2563EB','#22C55E','#8B5CF6','#F59E0B','#14B8A6','#EC4899','#0EA5E9','#F97316','#A855F7','#64748B'];

// ---- Shared helpers, kept because every report topic will want them ----
const fmtInt = n => (n == null ? '—' : Math.round(n).toLocaleString());
const peso = n => (n == null ? '—' : '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const usd  = n => (n == null ? '—' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const inRange = (d, a, b) => d && d >= a && d <= b;

function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function mean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; }

// Percentage-change cell. lowerIsBetter flips the colour for time measures,
// where a drop is the good outcome.
function changeCell(cur, prev, opts = {}) {
  if (cur == null || prev == null || prev === 0) return '<span style="color:var(--ink-faint);font-weight:600;">—</span>';
  const pct = Math.round(((cur - prev) / prev) * 100);
  const good = opts.lowerIsBetter ? pct <= 0 : pct >= 0;
  return `<span style="color:${good ? 'var(--success)' : 'var(--danger)'};">${pct >= 0 ? '↑' : '↓'} ${Math.abs(pct)}%</span>`;
}

// rows: [{ label, value, display?, sub?, color? }]
function barList(el, rows, emptyMsg) {
  if (!rows.length) { el.innerHTML = `<div class="note">${escapeHtml(emptyMsg || 'No data.')}</div>`; return; }
  const max = Math.max(...rows.map(r => r.value)) || 1;
  el.innerHTML = rows.map((r, i) => `
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, Math.round((r.value / max) * 100))}%;background:${r.color || PALETTE[i % PALETTE.length]};"></div></div>
      <div class="bar-val">${r.display != null ? r.display : r.value.toLocaleString()}</div>
      ${r.sub != null ? `<div class="bar-sub">${escapeHtml(r.sub)}</div>` : ''}
    </div>`).join('');
}

async function apiGet(path) {
  const token = localStorage.getItem('pipeline_token');
  const res = await fetch(`${API_BASE}${path}`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
