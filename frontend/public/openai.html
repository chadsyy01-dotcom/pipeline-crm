<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenAI — CSR Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --primary:#2563EB; --primary-tint:#EFF4FF;
    --success:#22C55E; --success-tint:#EAFBF1;
    --warning:#F59E0B; --warning-tint:#FEF6E7;
    --danger:#EF4444; --danger-tint:#FDECEC;
    --bg:#F8FAFC; --card:#FFFFFF;
    --ink:#0F172A; --ink-soft:#475569; --ink-faint:#94A3B8;
    --line:#EEF1F6;
    --radius-md:14px;
    --shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  .app{display:flex;min-height:100vh;}

  .sidebar{width:248px;flex-shrink:0;background:#0B1220;color:#CBD5E1;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#60A5FA);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;}
  .brand-name{font-size:14px;font-weight:700;color:#fff;line-height:1.25;}
  .brand-name span{display:block;font-weight:500;color:#8DA2C0;font-size:12px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:#AEBBD1;cursor:pointer;margin-bottom:2px;}
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:#151E30;color:#fff;}
  .nav-item.active{background:var(--primary);color:#fff;}
  .nav-item.soon{opacity:.45;cursor:default;pointer-events:none;position:relative;}
  .nav-item.soon .soon-tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.02em;background:#1C273B;color:#748199;padding:2px 6px;border-radius:6px;}
  .sidebar-status{margin-top:auto;background:#151E30;border-radius:12px;padding:11px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:#AEBBD1;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;box-shadow:0 0 0 3px rgba(34,197,94,.18);}

  .main{flex:1;min-width:0;padding:26px 32px 40px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:16px;}
  .greeting h1{font-size:23px;margin:0 0 4px;font-weight:800;}
  .greeting p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .tabs{display:flex;gap:4px;background:#F1F5F9;border-radius:8px;padding:3px;}
  .tab{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:6px;color:var(--ink-soft);cursor:pointer;border:none;background:transparent;font-family:inherit;}
  .tab.active{background:var(--card);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .kpi-card{background:var(--card);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .kpi-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-bottom:8px;}
  .kpi-value{font-size:34px;font-weight:800;letter-spacing:-.01em;}

  .panel{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h3{margin:0;font-size:14.5px;font-weight:700;}

  .li-table{width:100%;border-collapse:collapse;}
  .li-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:700;padding:0 8px 10px;border-bottom:1px solid var(--line);}
  .li-table td{padding:10px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  .li-table tr:last-child td{border-bottom:none;}
  .li-table td.num{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;}
  .li-table th.num{text-align:right;}

  .empty-note{color:var(--ink-faint);font-size:13px;padding:24px 4px;text-align:center;}
  .setup-note{background:var(--warning-tint);color:#92620A;border-radius:10px;padding:12px 14px;font-size:12.5px;font-weight:600;margin-bottom:16px;line-height:1.5;}

  @media (max-width:860px){ .sidebar{display:none;} .main{padding:20px 16px 32px;} }
</style>
</head>
<body>
<script>
  const API_BASE = "https://pipeline-crm-production-412d.up.railway.app/api";
  const LOGIN_PATH = "/login";
  (async function checkAuth() {
    const token = localStorage.getItem("pipeline_token");
    if (!token) { window.location.href = LOGIN_PATH; return; }
    try {
      const res = await fetch(`${API_BASE}/auth/me`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) throw new Error("Invalid session");
    } catch (err) {
      localStorage.removeItem("pipeline_token");
      window.location.href = LOGIN_PATH;
    }
  })();
</script>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CS</div>
      <div class="brand-name">CSR Dashboard<span>Support Console</span></div>
    </div>
    <a href="csr-dashboard.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="tickets.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v3a2 2 0 000 4v3a2 2 0 01-2 2H5a2 2 0 01-2-2v-3a2 2 0 000-4V8z"/></svg>
      Tickets
    </a>
    <a href="kyc.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M4 17c0-1.5 1.5-3 4.5-3s4.5 1.5 4.5 3"/><path d="M15 10h5M15 14h3"/></svg>
      KYC
    </a>
    <a href="reports.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      Reports
    </a>
    <a href="openai.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      OpenAI
    </a>
    <div class="nav-item soon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Agents <span class="soon-tag">Soon</span>
    </div>
    <div class="nav-item soon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      Knowledge Base <span class="soon-tag">Soon</span>
    </div>
    <a href="settings.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.09-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </a>
    <div class="sidebar-status" style="margin-top:auto;"><span class="dot"></span> Online — Connected as CSR</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="greeting">
        <h1>OpenAI Billing</h1>
        <p>Spend on your connected OpenAI organization.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <select id="accountSelect" style="font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer;"></select>
        <button onclick="exportBillingCsv()" style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Export CSV
        </button>
      </div>
    </div>

    <div class="panel" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <select id="rangeSelect" style="font-size:13px;font-weight:700;padding:9px 12px;border-radius:8px;border:1px solid var(--line);color:var(--ink);background:var(--card);cursor:pointer;">
        <option value="today">Today</option>
        <option value="7d">7 Days</option>
        <option value="month" selected>This Month</option>
        <option value="prev_month">Previous Month</option>
        <option value="all">All Time</option>
        <option value="custom">Custom Range…</option>
      </select>
      <div id="customRangeRow" style="display:none;align-items:center;gap:8px;">
        <input type="date" id="customStart" style="font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--line);">
        <span style="color:var(--ink-faint);font-size:13px;">to</span>
        <input type="date" id="customEnd" style="font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;border:1px solid var(--line);">
        <button onclick="loadBilling()" style="font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-family:inherit;">Apply</button>
      </div>
      <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;margin-left:auto;">
        <input type="checkbox" id="compareToggle" onchange="loadBilling()">
        Compare to previous period
      </label>
    </div>

    <div id="setupNote" class="setup-note" style="display:none;"></div>

    <div class="kpi-card">
      <div class="kpi-label" id="kpiLabel">Total spend — this month</div>
      <div class="kpi-value" id="kpiTotal">—</div>
      <div id="kpiCompare" style="font-size:12.5px;font-weight:600;margin-top:8px;display:none;"></div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Daily Spend</h3></div>
      <canvas id="dailyChart" height="90"></canvas>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Cost by Line Item</h3></div>
      <table class="li-table">
        <thead><tr><th>Line Item</th><th class="num">Cost</th></tr></thead>
        <tbody id="lineItemsBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script>
let currentRange = 'month';
let currentAccount = 0;
let dailyChart = null;
let lastBillingData = null;

document.getElementById('rangeSelect').addEventListener('change', (e) => {
  currentRange = e.target.value;
  document.getElementById('customRangeRow').style.display = currentRange === 'custom' ? 'flex' : 'none';
  if (currentRange !== 'custom') loadBilling();
});

document.getElementById('accountSelect').addEventListener('change', (e) => {
  currentAccount = Number(e.target.value);
  loadBilling();
});

function loadAccounts() {
  const token = localStorage.getItem('pipeline_token');
  fetch(`${API_BASE}/openai-billing/accounts`, { headers: { Authorization: `Bearer ${token}` } })
    .then(res => res.ok ? res.json() : { accounts: [] })
    .then(data => {
      const select = document.getElementById('accountSelect');
      const accounts = data.accounts || [];
      if (accounts.length === 0) {
        select.innerHTML = '<option value="0">No accounts configured</option>';
        return;
      }
      select.innerHTML = accounts.map(a => `<option value="${a.index}">${a.name}</option>`).join('');
      loadBilling();
    })
    .catch(() => loadBilling());
}

function rangeLabelText(range) {
  if (range === 'today') return 'Today';
  if (range === '7d') return 'Last 7 days';
  if (range === 'all') return 'All time';
  if (range === 'prev_month') return 'Previous month';
  if (range === 'custom') {
    const s = document.getElementById('customStart').value;
    const e = document.getElementById('customEnd').value;
    return s ? `${s}${e ? ' to ' + e : ' onward'}` : 'Custom range';
  }
  return 'This month';
}

function showSetupNote(msg) {
  const el = document.getElementById('setupNote');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function loadBilling() {
  if (currentRange === 'custom' && !document.getElementById('customStart').value) {
    return; // wait for the user to pick a start date and click Apply
  }
  document.getElementById('kpiLabel').textContent = `Total spend — ${rangeLabelText(currentRange)}`;
  const token = localStorage.getItem('pipeline_token');
  const compare = document.getElementById('compareToggle').checked;

  let url = `${API_BASE}/openai-billing/summary?range=${currentRange}&account=${currentAccount}&compare=${compare}`;
  if (currentRange === 'custom') {
    const start = document.getElementById('customStart').value;
    const end = document.getElementById('customEnd').value;
    url += `&start=${start}`;
    if (end) url += `&end=${end}`;
  }

  fetch(url, { headers: { Authorization: `Bearer ${token}` } })
    .then(async res => {
      if (res.status === 404) {
        showSetupNote("⚠️ The /api/openai-billing/summary endpoint isn't live on the backend yet. Add the OpenAI proxy route to your Railway API to activate this page.");
        return null;
      }
      const data = await res.json();
      if (!res.ok) {
        showSetupNote(`⚠️ ${data.error || 'Could not load OpenAI billing data.'}`);
        return null;
      }
      return data;
    })
    .then(data => {
      if (!data) return;
      showSetupNote('');
      renderBilling(data);
    })
    .catch(err => {
      console.error(err);
      showSetupNote('⚠️ Could not reach the billing endpoint. Check the backend proxy is deployed.');
    });
}

function renderBilling(data) {
  lastBillingData = data;
  document.getElementById('kpiTotal').textContent = `$${data.totalUsd.toFixed(2)}`;

  const compareEl = document.getElementById('kpiCompare');
  if (data.comparison) {
    const prev = data.comparison.totalUsd;
    const diff = prev > 0 ? Math.round(((data.totalUsd - prev) / prev) * 100) : null;
    const arrow = diff === null ? '' : (diff >= 0 ? '↑' : '↓');
    const color = diff === null ? 'var(--ink-faint)' : (diff >= 0 ? 'var(--danger)' : 'var(--success)');
    compareEl.style.display = 'block';
    compareEl.style.color = color;
    compareEl.textContent = diff === null
      ? `Previous period: $${prev.toFixed(2)} (no prior spend to compare)`
      : `${arrow} ${Math.abs(diff)}% vs previous period ($${prev.toFixed(2)})`;
  } else {
    compareEl.style.display = 'none';
  }

  const daily = data.dailyTotals || [];
  if (dailyChart) dailyChart.destroy();
  dailyChart = new Chart(document.getElementById('dailyChart'), {
    type: 'line',
    data: {
      labels: daily.map(d => d.date),
      datasets: [{
        label: 'Daily spend (USD)',
        data: daily.map(d => d.amount),
        borderColor: '#2563EB',
        backgroundColor: 'rgba(37,99,235,.08)',
        fill: true,
        tension: .3,
        pointRadius: 0,
        borderWidth: 2.5
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: '#EEF1F6' }, ticks: { callback: v => '$' + v } }
      }
    }
  });

  const body = document.getElementById('lineItemsBody');
  const items = data.topLineItems || [];
  if (items.length === 0) {
    body.innerHTML = '<tr><td colspan="2"><div class="empty-note">No cost line items in this period</div></td></tr>';
  } else {
    body.innerHTML = items.map(li => `
      <tr>
        <td>${li.label}</td>
        <td class="num">$${li.amount.toFixed(4)}</td>
      </tr>
    `).join('');
  }
}

// Exports the cost/usage breakdown currently shown (daily spend, line items,
// per-model token usage) as a CSV file. This is NOT an OpenAI invoice PDF —
// OpenAI doesn't expose invoice history via API — it's the Costs/Usage data
// this page already pulls, saved for your own records.
function exportBillingCsv() {
  if (!lastBillingData) {
    alert('No billing data loaded yet.');
    return;
  }
  const data = lastBillingData;
  const sections = [];

  sections.push(`Account,${data.account}`);
  sections.push(`Range,${rangeLabelText(data.range)}`);
  sections.push(`Total Spend (USD),${data.totalUsd.toFixed(4)}`);
  sections.push('');

  sections.push('Daily Spend');
  sections.push(Papa.unparse((data.dailyTotals || []).map(d => ({ Date: d.date, 'Amount (USD)': d.amount.toFixed(4) }))));
  sections.push('');

  sections.push('Cost by Line Item');
  sections.push(Papa.unparse((data.topLineItems || []).map(li => ({ 'Line Item': li.label, 'Amount (USD)': li.amount.toFixed(4) }))));

  const csv = sections.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `openai-billing-${data.account.replace(/\s+/g, '-').toLowerCase()}-${data.range}-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadAccounts();
</script>
</body>
</html>
